version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: creditos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: creditos_db
      POSTGRES_USER: creditos_user
      POSTGRES_PASSWORD: creditos_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creditos_user -d creditos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: creditos_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/creditos_db
      SPRING_DATASOURCE_USERNAME: creditos_user
      SPRING_DATASOURCE_PASSWORD: creditos_pass
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: creditos_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
