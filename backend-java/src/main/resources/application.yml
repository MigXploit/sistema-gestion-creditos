spring:
  application:
    name: sistema-creditos

  datasource:
    url: jdbc:postgresql://localhost:5432/creditos_db
    username: creditos_user
    password: creditos_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  servlet:
    context-path: /api

# Seguridad JWT (RNF01)
app:
  jwt:
    # Clave RS256 - en producción cargar desde keystore externo
    secret: "creditos-umsa-secret-key-2026-fase1-placeholder-256bits-minimum"
    expiration-ms: 900000  # 15 minutos (RNF01)
  security:
    max-login-attempts: 5          # Bloqueo tras 5 intentos (RNF01)
    lockout-duration-minutes: 30   # Tiempo de bloqueo
  integraciones:
    buro:
      url: http://localhost:9090/buro  # Mock
      timeout-ms: 30000
      max-retries: 3
    core-bancario:
      url: http://localhost:9091/core  # Mock
      timeout-ms: 30000
      max-retries: 3

logging:
  level:
    com.umsa.creditos: DEBUG
    org.springframework.security: INFO
